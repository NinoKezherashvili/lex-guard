<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>LexyGuard</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <rect
            x="3"
            y="11"
            width="18"
            height="11"
          />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          <circle
            cx="12"
            cy="16"
            r="1.5"
            fill="currentColor"
          />
          <path d="M12 17.5V19" />
        </svg>
        <span>LexyGuard</span>
      </div>
      <div class="lang-switcher">
        <button
          class="lang-btn"
          data-lang="en"
        >
          EN
        </button>
        <button
          class="lang-btn"
          data-lang="ka"
        >
          ქარ
        </button>
      </div>
    </div>

    <div class="status">
      <span
        class="status-label"
        id="status-label"
        >Status</span
      >
      <span class="status-badge">
        <span class="status-dot"></span>
        <span id="status-value">Active</span>
      </span>
    </div>

    <div class="section">
      <div
        class="section-title"
        id="settings-title"
      >
        Settings
      </div>
      <div class="settings-list">
        <div class="setting-item">
          <span class="setting-label">
            <span class="setting-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <rect
                  x="5"
                  y="2"
                  width="14"
                  height="20"
                />
                <path d="M2 8v8M22 8v8" />
              </svg>
            </span>
            <span id="shake-label">Shake on detection</span>
          </span>
          <label class="toggle">
            <input
              type="checkbox"
              id="setting-shake"
              checked
            />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <span class="setting-label">
            <span class="setting-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
            </span>
            <span id="sound-label">Sound alert</span>
          </span>
          <label class="toggle">
            <input
              type="checkbox"
              id="setting-sound"
            />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
      <!-- API Key - hidden for now
    <div class="key-input-wrapper">
      <label class="key-input-label" id="key-label">API Key</label>
      <input type="password" class="key-input" id="api-key-input" placeholder="Enter your API key" disabled>
    </div>
    --></div>

    <div
      class="section"
      id="patterns-section"
    >
      <div
        class="section-header"
        id="patterns-header"
      >
        <div
          class="section-title"
          id="detecting-title"
        >
          Detecting (7 patterns)
        </div>
        <div class="section-toggle">
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </div>
      </div>
      <div class="section-content">
        <div
          class="detect-list"
          id="detect-list"
        ></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
